<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Report Lost Item</title>
    <link rel="stylesheet" href="lost.css">
</head>

<body>
    <div class="container lost-page">

        <h1 class="main-heading">Lost something!</h1>

        <p class="subtitle">
            Don't worry. Fill in the details below to report a lost item in the hostel.
        </p>

        <!-- 🔑 ONLY id ADDED -->
        <form class="lost-form" id="lostForm">

            <div class="form-grid">

                <label>
                    Item Name
                    <input type="text" id="itemName" placeholder="e.g. ID Card, Keys" required>
                </label>

                <label>
                    Item Category
                    <select id="category" required>
                        <option value="">Select category</option>
                        <option>ID Card</option>
                        <option>Keys</option>
                        <option>Electronics</option>
                        <option>Books</option>
                        <option>Other</option>
                    </select>
                </label>

                <label>
                    Your name
                    <input type="text" id="name" placeholder="Your name" required>
                </label>

                <label>
                    Location of Loss
                    <input type="text" id="location" placeholder="e.g. Mess, Room 203, Library">
                </label>

                <label>
                    Date of Loss
                    <input type="date" id="dateLost">
                </label>

                <label>
                    Approximate Time
                    <input type="time" id="timeLost">
                </label>

                <label class="full-width">
                    Description
                    <textarea id="description" rows="4"
                        placeholder="Describe the item, color, location, etc."></textarea>
                </label>

                <label class="full-width">
                    Upload Item Image (optional)
                    <input type="file" id="image" accept="image/*">
                </label>

                <!-- 🔑 CONTACT ADDED (LOGIC NEEDS IT) -->
                <label class="full-width">
                    Contact Info
                    <input type="text" id="contact" placeholder="Phone no" required>
                </label>

            </div>

            <button type="submit" class="submit-btn">
                Submit Lost Item
            </button>

        </form>

        <a href="index.html" class="back-link">← Back to Home</a>

    </div>


    <script type="module" src="js-lost.js"></script>

</body>
</html>
